<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti-Human Tests · Java 异常生成器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  .app { width: 100%; max-width: 900px; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 22px; }

  header h1 {
    font-size: 24px;
    background: linear-gradient(90deg, #58a6ff, #bc8cff, #ff7b72);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  header .sub { color: #8b949e; font-size: 13px; }
  header .warnline { color: #d29922; font-size: 12px; margin-top: 6px; letter-spacing: .3px; }

  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    margin-bottom: 18px;
  }

  .card h2 {
    font-size: 15px;
    color: #c9d1d9;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card h2 .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #58a6ff;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
  }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .field label {
    font-size: 12px;
    color: #8b949e;
    font-weight: 500;
  }

  .field input,
  .field select,
  .field textarea {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px 12px;
    color: #e6edf3;
    font-size: 13.5px;
    font-family: inherit;
    transition: border-color .15s ease;
    width: 100%;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: none;
    border-color: #58a6ff;
  }

  .field textarea {
    resize: vertical;
    min-height: 60px;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 13px;
  }

  .field select { cursor: pointer; }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .btn {
    border: none;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn.primary { background: linear-gradient(90deg, #238636, #2ea043); }
  .btn.random  { background: linear-gradient(90deg, #8957e5, #bc8cff); }
  .btn.copy    { background: linear-gradient(90deg, #1f6feb, #388bfd); }
  .btn.sample  { background: linear-gradient(90deg, #db61a2, #f778ba); }
  .btn.clear   { background: linear-gradient(90deg, #6e7681, #8b949e); }

  .preview {
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 10px;
    padding: 16px;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 13px;
    line-height: 1.75;
    color: #c9d1d9;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 200px;
  }

  .preview .err { color: #f85149; }
  .preview .warn { color: #d29922; }
  .preview .info { color: #58a6ff; }
  .preview .dim { color: #8b949e; }
  .preview .chaos { color: #bc8cff; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #238636;
    color: #fff;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    transition: transform .3s ease;
    z-index: 9999;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  .footer {
    text-align: center;
    color: #8b949e;
    font-size: 12px;
    margin-top: 24px;
    line-height: 1.8;
  }

  .footer a {
    color: #58a6ff;
    text-decoration: none;
  }

  .footer a:hover { text-decoration: underline; }

  /* ============================================================
     猎奇动效：一堆东西乱飞 + 抖动 + 故障闪烁
     ============================================================ */

  /* 乱飞层：铺满全屏、不挡点击 */
  .chaos-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }

  /* 闪烁乱码背景层：铺满全屏、不挡点击、置于内容之下 */
  .glitch-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: #0d1117;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 14px;
    line-height: 1.1;
    white-space: pre;
    word-break: break-all;
    color: #161b22;
    text-shadow: 0 0 6px rgba(88,166,255,.25), 0 0 10px rgba(188,140,255,.18);
    opacity: .55;
    user-select: none;
    mix-blend-mode: screen;
    animation: bg-flicker .18s steps(2) infinite;
  }

  @keyframes bg-flicker {
    0%   { opacity: .50; filter: hue-rotate(0deg)   brightness(1); }
    25%  { opacity: .62; filter: hue-rotate(40deg)  brightness(1.3); }
    50%  { opacity: .40; filter: hue-rotate(120deg) brightness(.8); }
    75%  { opacity: .66; filter: hue-rotate(220deg) brightness(1.5); }
    100% { opacity: .52; filter: hue-rotate(320deg) brightness(1); }
  }

  /* 全屏故障覆盖层（点「📺 全屏故障」触发） */
  .glitch-overlay {
    position: fixed;
    inset: 0;
    z-index: 70;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(248,81,73,.25) 0 6px, transparent 6px 14px),
      repeating-linear-gradient(90deg, rgba(88,166,255,.2) 0 12px, transparent 12px 28px);
    mix-blend-mode: screen;
    animation: overlay-glitch .12s steps(2) infinite;
  }

  @keyframes overlay-glitch {
    0%   { transform: translate(0,0) scale(1); filter: hue-rotate(0deg); }
    50%  { transform: translate(-6px,4px) scale(1.04); filter: hue-rotate(160deg); }
    100% { transform: translate(5px,-3px) scale(.98); filter: hue-rotate(300deg); }
  }

  /* 反色闪屏（点「🌈 反色闪屏」触发） */
  body.invert { animation: invert-flash .25s steps(1) infinite; }
  @keyframes invert-flash {
    0%, 100% { filter: invert(0) hue-rotate(0deg); }
    50%      { filter: invert(1) hue-rotate(180deg); }
  }

  .fly {
    position: absolute;
    line-height: 1;
    white-space: nowrap;
    user-select: none;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 6px rgba(188,140,255,.6));
    font-weight: 700;
  }

  @keyframes fly-across {
    0%   { transform: translate(0,0) rotate(0deg) scale(.5); opacity: 0; }
    8%   { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(var(--sc)); opacity: 0; }
  }

  @keyframes spin-crazy {
    from { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.5); }
    to   { transform: rotate(360deg) scale(1); }
  }

  /* 故障闪烁（作用于副标题，避免破坏渐变标题） */
  @keyframes glitch {
    0%, 100% { transform: translate(0,0); text-shadow: 0 0 0 transparent; }
    20% { transform: translate(-2px,1px); text-shadow: 2px 0 #f85149, -2px 0 #58a6ff; }
    40% { transform: translate(2px,-1px); text-shadow: -2px 0 #bc8cff, 2px 0 #d29922; }
    60% { transform: translate(-1px,-1px); text-shadow: 2px 0 #58a6ff, -2px 0 #f85149; }
    80% { transform: translate(1px,1px); text-shadow: -2px 0 #2ea043, 2px 0 #bc8cff; }
  }

  header .sub { animation: glitch 2.6s infinite steps(1); }

  /* 整页抖动（点“让我崩溃”时触发） */
  @keyframes shake {
    0%, 100% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-5px,3px) rotate(-1.2deg); }
    40% { transform: translate(5px,-3px) rotate(1.2deg); }
    60% { transform: translate(-3px,-3px) rotate(-.6deg); }
    80% { transform: translate(3px,2px) rotate(.6deg); }
  }

  .app.shake { animation: shake .16s infinite; }

  /* 光敏提醒横幅 */
  .seizure-warn {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 70;
    background: #f85149;
    color: #fff;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 12px;
    box-shadow: 0 4px 18px rgba(248,81,73,.5);
    animation: glitch 1.2s infinite steps(1);
  }

  /* 关闭动效的开关 */
  .calm-toggle {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 60;
    font-size: 12px;
    color: #8b949e;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    user-select: none;
  }
  .calm-toggle:hover { color: #e6edf3; }

  .btn.mad {
    background: linear-gradient(90deg, #f85149, #bc8cff, #d29922, #58a6ff);
    background-size: 300% 100%;
    animation: rainbow 3s linear infinite;
  }

  @keyframes rainbow {
    from { background-position: 0% 0; }
    to   { background-position: 300% 0; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Anti-Human Tests · Java 异常生成器</h1>
    <p class="sub">包名随便起，类名随便写，消息随便编。生成一段 Java 看了都想辞职的日志。</p>
    <p class="warnline">仅供娱乐，请勿用于伪造真实崩溃日志</p>
  </header>

  <div class="card">
    <h2><span class="dot"></span>自定义异常</h2>

    <div class="grid">
      <div class="field">
        <label>包名（package）</label>
        <input id="pkg" type="text" value="jerk.loser" placeholder="例如 jerk.loser">
      </div>
      <div class="field">
        <label>类名（class）</label>
        <input id="cls" type="text" value="看你不顺眼extortionate" placeholder="例如 看你不顺眼extortionate">
      </div>
      <div class="field">
        <label>异常消息（message）</label>
        <input id="msg" type="text" value="咋滴我就崩" placeholder="例如 咋滴我就崩">
      </div>
      <div class="field">
        <label>Caused by 消息（可选）</label>
        <input id="cause" type="text" value="Java被臭袜子熏死了" placeholder="例如 Java被臭袜子熏死了">
      </div>
      <div class="field">
        <label>Caused by 的类名（可选）</label>
        <input id="causeCls" type="text" value="🧦🧦🧦🧦臭袜子Ex" placeholder="例如 🧦🧦🧦🧦臭袜子Ex">
      </div>
      <div class="field">
        <label>日志格式</label>
        <select id="format">
          <option value="bare">裸异常（printStackTrace）</option>
          <option value="log4j">Log4j 风格</option>
          <option value="forge">Forge/NeoForge 风格</option>
          <option value="full">完整崩溃报告</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="genBtn">生成日志</button>
      <button class="btn random" id="randBtn">🎲 随机生成</button>
      <button class="btn sample" id="sampleBtn">📋 示例输出</button>
      <button class="btn copy" id="copyBtn">📋 复制</button>
      <button class="btn clear" id="clearBtn">清空</button>
    </div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>预览</h2>
    <div class="preview" id="preview">点击“生成日志”看看效果。</div>
  </div>

  <div class="card" id="chaosConsole" style="display:none; border-color:#bc8cff;">
    <h2><span class="dot" style="background:#bc8cff;"></span>混沌控制台 <span style="font-size:11px;color:#8b949e;">(确认后才开放)</span></h2>
    <div class="actions">
      <button class="btn mad" id="madBtn2">💥 再崩一次</button>
      <button class="btn random" id="spawnBtn">🌀 召唤乱码雨</button>
      <button class="btn copy" id="glitchBtn">📺 全屏故障</button>
      <button class="btn sample" id="invertBtn">🌈 反色闪屏</button>
      <button class="btn clear" id="stopBtn">⏹ 停止全部动效</button>
    </div>
  </div>

  <div class="footer">
    <p>仅供娱乐。请勿用于真实的崩溃日志伪造。</p>
    <p>⚠️ 本页含闪烁、抖动与乱飞元素，光敏性癫痫 / 易晕动者慎入；点「💥 让我崩溃」前请三思。</p>
    <p>如果你因为本项目友尽，作者概不负责。</p>
    <p>—— 来自 <a href="#">Anti-Human Tests</a></p>
    <p style="margin-top:10px;"><span class="calm-toggle" id="calmToggle">🧘 关闭猎奇动效</span></p>
  </div>

</div>

  <!-- 一堆东西乱飞的猎奇层 -->
  <div class="chaos-layer" id="chaosLayer" aria-hidden="true"></div>

  <!-- 闪烁乱码背景 -->
  <div class="glitch-bg" id="glitchBg" aria-hidden="true"></div>

  <!-- 光敏提醒（默认隐藏，点“让我崩溃”才出现） -->
  <div class="seizure-warn" id="seizureWarn" style="display:none;">
    ⚠️ 此按钮包含快速闪烁与剧烈抖动，光敏性癫痫 / 易晕动者请勿点击。
  </div>

  <button class="btn mad" id="madBtn" style="position:fixed; right:18px; bottom:18px; z-index:60;">💥 让我崩溃</button>

  <div class="toast" id="toast">已复制到剪贴板</div>
